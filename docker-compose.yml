services:
  phoenix:
    image: arizephoenix/phoenix:latest
    profiles: ["dev", "prod"]
    ports:
      - "6006:6006"
      - "4317:4317"
    environment:
      PHOENIX_WORKING_DIR: /phoenix
    volumes:
      - phoenix-data:/phoenix

  dev:
    profiles: ["dev"]
    build:
      context: ./server
    ports:
      - "8000:8000"
    depends_on:
      - phoenix
    environment:
      APP_ENV: dev
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      LLM_MAX_ATTEMPTS: ${LLM_MAX_ATTEMPTS:-3}
      PHOENIX_COLLECTOR_ENDPOINT: ${PHOENIX_COLLECTOR_ENDPOINT:-http://phoenix:6006}
      PHOENIX_API_KEY: ${PHOENIX_API_KEY:-}
    volumes:
      - ./server:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  prod:
    profiles: ["prod"]
    build:
      context: ./server
    ports:
      - "8000:8000"
    depends_on:
      - phoenix
    environment:
      APP_ENV: prod
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      LLM_MAX_ATTEMPTS: ${LLM_MAX_ATTEMPTS:-3}
      PHOENIX_COLLECTOR_ENDPOINT: ${PHOENIX_COLLECTOR_ENDPOINT:-http://phoenix:6006}
      PHOENIX_API_KEY: ${PHOENIX_API_KEY:-}

volumes:
  phoenix-data:
