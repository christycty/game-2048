server {
    listen 80;
    root /usr/share/nginx/html;

    # Prod Compose publishes this container only. /suggest is forwarded to the
    # API service on the Compose network. 127.0.0.11 is Docker's DNS. A
    # variable upstream is resolved per request, so nginx can start before
    # the API is listening. 30s covers the 20s suggestion budget.
    location = /suggest {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $suggest_upstream prod:8000;
        proxy_pass http://$suggest_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
