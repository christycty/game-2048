name: ci

on:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff format --check .
          ruff check .
      - name: Test
        env:
          EXPORT_TRACES: "false"
        run: pytest

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t game-2048-server ./server
          docker build -t game-2048-client ./client
      - name: Client image serves the app
        run: |
          docker run -d --name game-2048-client -p 127.0.0.1:5173:80 game-2048-client
          for _ in $(seq 1 30); do
            if curl -fsS -o /tmp/client.html http://127.0.0.1:5173/ \
              && grep -q 'id="root"' /tmp/client.html; then
              exit 0
            fi
            sleep 1
          done
          docker logs game-2048-client
          exit 1
      - name: API image serves health without Ollama
        run: |
          docker run -d --name game-2048-server -e EXPORT_TRACES=false -p 127.0.0.1:8000:8000 game-2048-server
          for _ in $(seq 1 30); do
            if curl -fsS -o /tmp/health.json http://127.0.0.1:8000/health \
              && python3 -c 'import json; assert json.load(open("/tmp/health.json"))["status"] == "ok"'; then
              exit 0
            fi
            sleep 1
          done
          docker logs game-2048-server
          exit 1
      - name: Compose keeps the container URL and loopback ports
        run: |
          cp .env.example .env
          printf '\nOLLAMA_BASE_URL=http://localhost:11434\nPHOENIX_COLLECTOR_ENDPOINT=http://localhost:6006\nEXPORT_TRACES=false\n' >> .env
          OLLAMA_BASE_URL=http://localhost:11434 \
          PHOENIX_COLLECTOR_ENDPOINT=http://localhost:6006 \
          EXPORT_TRACES=false \
            docker compose --profile dev --profile prod config --format json > /tmp/compose.json
          COMPOSE_OLLAMA_BASE_URL=http://ollama.example:11434 \
          COMPOSE_PHOENIX_COLLECTOR_ENDPOINT=http://phoenix.example:6006 \
            docker compose --profile dev config --format json > /tmp/compose-override.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/compose.json").read_text())
          override = json.loads(Path("/tmp/compose-override.json").read_text())
          loopback = {"127.0.0.1", "::1"}

          def env_value(config, service, key):
              env = config["services"][service]["environment"]
              if isinstance(env, dict):
                  return env[key]
              prefix = key + "="
              for item in env:
                  if item.startswith(prefix):
                      return item.split("=", 1)[1]
              raise SystemExit(f"{service} missing {key}")

          def bindings(service):
              found = []
              for port in data["services"][service].get("ports") or []:
                  ip = port.get("host_ip") or ""
                  if ip not in loopback:
                      raise SystemExit(f"{service} publishes {ip!r}, want loopback")
                  found.append((ip, int(port["published"]), int(port["target"])))
              return found

          def expect(service, published, target):
              found = bindings(service)
              for ip in loopback:
                  if (ip, published, target) not in found:
                      raise SystemExit(f"{service} missing {ip}:{published}->{target}, have {found}")

          want = "http://host.docker.internal:11434"
          phoenix = "http://host.docker.internal:6006"
          for service in ("dev", "prod"):
              got = env_value(data, service, "OLLAMA_BASE_URL")
              if got != want or "localhost" in got:
                  raise SystemExit(f"{service} OLLAMA_BASE_URL={got!r}, want {want!r}")
              traces = env_value(data, service, "EXPORT_TRACES")
              if traces != "true":
                  raise SystemExit(f"{service} EXPORT_TRACES={traces!r}, want 'true'")
              collector = env_value(data, service, "PHOENIX_COLLECTOR_ENDPOINT")
              if collector != phoenix or "localhost" in collector:
                  raise SystemExit(f"{service} PHOENIX_COLLECTOR_ENDPOINT={collector!r}, want {phoenix!r}")
          overridden = env_value(override, "dev", "OLLAMA_BASE_URL")
          if overridden != "http://ollama.example:11434":
              raise SystemExit(f"COMPOSE_OLLAMA_BASE_URL did not apply: {overridden!r}")
          phoenix_override = env_value(override, "dev", "PHOENIX_COLLECTOR_ENDPOINT")
          if phoenix_override != "http://phoenix.example:6006":
              raise SystemExit(f"COMPOSE_PHOENIX_COLLECTOR_ENDPOINT did not apply: {phoenix_override!r}")
          expect("dev", 8000, 8000)
          expect("prod", 8000, 8000)
          expect("client-dev", 5173, 5173)
          expect("client", 5173, 80)
          print("compose service DNS ok")
          PY
