name: ci

on:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff format --check .
          ruff check .
      - name: Test
        run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t game-2048-server ./server
      - name: Example env keeps Compose service DNS
        run: |
          cp .env.example .env
          env -u OLLAMA_BASE_URL \
            docker compose --profile dev --profile prod config --format json > /tmp/compose.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/compose.json").read_text())

          def env_value(service, key):
              env = data["services"][service]["environment"]
              if isinstance(env, dict):
                  return env[key]
              prefix = key + "="
              for item in env:
                  if item.startswith(prefix):
                      return item.split("=", 1)[1]
              raise SystemExit(f"{service} missing {key}")

          for service in ("dev", "prod"):
              got = env_value(service, "OLLAMA_BASE_URL")
              want = "http://host.docker.internal:11434"
              if got != want or "localhost" in got:
                  raise SystemExit(f"{service} OLLAMA_BASE_URL={got!r}, want {want!r}")
          print("compose service DNS ok")
          PY
