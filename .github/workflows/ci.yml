name: ci

on:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff format --check .
          ruff check .
      - name: Test
        run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t game-2048-server ./server
      - name: Health check
        run: |
          docker run -d --name game-2048-api -p 127.0.0.1:8000:8000 game-2048-server
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs game-2048-api
          exit 1
      - name: Example env keeps Compose service DNS
        run: |
          cp .env.example .env
          env -u OLLAMA_BASE_URL -u PHOENIX_COLLECTOR_ENDPOINT \
            docker compose --profile dev --profile prod config --format json > /tmp/compose.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/compose.json").read_text())

          def env_value(service, key):
              env = data["services"][service]["environment"]
              if isinstance(env, dict):
                  return env[key]
              prefix = key + "="
              for item in env:
                  if item.startswith(prefix):
                      return item.split("=", 1)[1]
              raise SystemExit(f"{service} missing {key}")

          expected = {
              "OLLAMA_BASE_URL": "http://host.docker.internal:11434",
              "PHOENIX_COLLECTOR_ENDPOINT": "http://phoenix:6006",
          }
          for service in ("dev", "prod"):
              for key, want in expected.items():
                  got = env_value(service, key)
                  if got != want or "localhost" in got:
                      raise SystemExit(f"{service} {key}={got!r}, want {want!r}")
          print("compose service DNS ok")
          PY
