name: ci

on:
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pin script behavior with unit tests
        working-directory: scripts
        run: python -m unittest discover -v -s . -p 'test_*.py'
      - name: Check relative Markdown links
        run: python scripts/check_doc_links.py
      - name: Nudge when code changes without agent docs
        env:
          DOCS_BASE_REF: ${{ github.base_ref }}
        run: python scripts/check_docs_freshness.py

  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff format --check .
          ruff check .
      - name: Test
        env:
          EXPORT_TRACES: "false"
        run: pytest

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t game-2048-server ./server
          docker build -t game-2048-client ./client
      - name: Client image serves the app
        run: |
          docker run -d --name game-2048-client -p 127.0.0.1:5173:80 game-2048-client
          for _ in $(seq 1 30); do
            if curl -fsS -o /tmp/client.html http://127.0.0.1:5173/ \
              && grep -q 'id="root"' /tmp/client.html; then
              exit 0
            fi
            sleep 1
          done
          docker logs game-2048-client
          exit 1
      - name: API image serves health without Ollama
        run: |
          docker run -d --name game-2048-server -e EXPORT_TRACES=false -p 127.0.0.1:8000:8000 game-2048-server
          for _ in $(seq 1 30); do
            if curl -fsS -o /tmp/health.json http://127.0.0.1:8000/health \
              && python3 -c 'import json; assert json.load(open("/tmp/health.json"))["status"] == "ok"'; then
              exit 0
            fi
            sleep 1
          done
          docker logs game-2048-server
          exit 1
      - name: Compose keeps the container URL and loopback ports
        run: |
          cp .env.example .env
          printf '\nOLLAMA_BASE_URL=http://localhost:11434\nPHOENIX_COLLECTOR_ENDPOINT=http://localhost:6006\nEXPORT_TRACES=false\n' >> .env
          OLLAMA_BASE_URL=http://localhost:11434 \
          PHOENIX_COLLECTOR_ENDPOINT=http://localhost:6006 \
          EXPORT_TRACES=false \
            docker compose --profile dev --profile prod config --format json > /tmp/compose.json
          COMPOSE_OLLAMA_BASE_URL=http://ollama.example:11434 \
          COMPOSE_PHOENIX_COLLECTOR_ENDPOINT=http://phoenix.example:6006 \
            docker compose --profile dev config --format json > /tmp/compose-override.json
          docker compose --profile metrics config --format json > /tmp/compose-metrics.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/compose.json").read_text())
          override = json.loads(Path("/tmp/compose-override.json").read_text())
          metrics = json.loads(Path("/tmp/compose-metrics.json").read_text())
          loopback = {"127.0.0.1", "::1"}

          def env_value(config, service, key):
              env = config["services"][service]["environment"]
              if isinstance(env, dict):
                  return env[key]
              prefix = key + "="
              for item in env:
                  if item.startswith(prefix):
                      return item.split("=", 1)[1]
              raise SystemExit(f"{service} missing {key}")

          def bindings(config, service):
              found = []
              for port in config["services"][service].get("ports") or []:
                  ip = port.get("host_ip") or ""
                  if ip not in loopback:
                      raise SystemExit(f"{service} publishes {ip!r}, want loopback")
                  found.append((ip, int(port["published"]), int(port["target"])))
              return found

          def expect(config, service, published, target):
              found = bindings(config, service)
              for ip in loopback:
                  if (ip, published, target) not in found:
                      raise SystemExit(f"{service} missing {ip}:{published}->{target}, have {found}")

          want = "http://host.docker.internal:11434"
          phoenix = "http://host.docker.internal:6006"
          for service in ("dev", "prod"):
              got = env_value(data, service, "OLLAMA_BASE_URL")
              if got != want or "localhost" in got:
                  raise SystemExit(f"{service} OLLAMA_BASE_URL={got!r}, want {want!r}")
              traces = env_value(data, service, "EXPORT_TRACES")
              if traces != "true":
                  raise SystemExit(f"{service} EXPORT_TRACES={traces!r}, want 'true'")
              collector = env_value(data, service, "PHOENIX_COLLECTOR_ENDPOINT")
              if collector != phoenix or "localhost" in collector:
                  raise SystemExit(f"{service} PHOENIX_COLLECTOR_ENDPOINT={collector!r}, want {phoenix!r}")
          overridden = env_value(override, "dev", "OLLAMA_BASE_URL")
          if overridden != "http://ollama.example:11434":
              raise SystemExit(f"COMPOSE_OLLAMA_BASE_URL did not apply: {overridden!r}")
          phoenix_override = env_value(override, "dev", "PHOENIX_COLLECTOR_ENDPOINT")
          if phoenix_override != "http://phoenix.example:6006":
              raise SystemExit(f"COMPOSE_PHOENIX_COLLECTOR_ENDPOINT did not apply: {phoenix_override!r}")
          def expect_unpublished(service):
              ports = data["services"][service].get("ports") or []
              if ports:
                  raise SystemExit(f"{service} publishes {ports}")

          expect(data, "dev", 8000, 8000)
          expect_unpublished("prod")
          expect(data, "client-dev", 5173, 5173)
          expect(data, "client", 5173, 80)
          expect(metrics, "prometheus", 9090, 9090)
          expect(metrics, "grafana", 3000, 3000)
          for service in ("dev", "prod"):
              aliases = (
                  data["services"][service]
                  .get("networks", {})
                  .get("default", {})
                  .get("aliases")
                  or []
              )
              if "api" not in aliases:
                  raise SystemExit(f"{service} missing network alias 'api', have {aliases}")

          import os
          import subprocess

          moved = subprocess.check_output(
              [
                  "docker",
                  "compose",
                  "--profile",
                  "dev",
                  "--profile",
                  "prod",
                  "--profile",
                  "metrics",
                  "config",
                  "--format",
                  "json",
              ],
              env={
                  **os.environ,
                  "API_HOST_PORT": "18000",
                  "CLIENT_HOST_PORT": "15173",
                  "PROMETHEUS_HOST_PORT": "19090",
                  "GRAFANA_HOST_PORT": "13000",
              },
              text=True,
          )
          moved_data = json.loads(moved)

          def moved_bindings(service):
              found = []
              for port in moved_data["services"][service].get("ports") or []:
                  found.append((int(port["published"]), int(port["target"])))
              return found

          if (18000, 8000) not in moved_bindings("dev"):
              raise SystemExit(f"API_HOST_PORT did not apply: {moved_bindings('dev')}")
          if (15173, 5173) not in moved_bindings("client-dev"):
              raise SystemExit(f"CLIENT_HOST_PORT did not apply to client-dev: {moved_bindings('client-dev')}")
          if (15173, 80) not in moved_bindings("client"):
              raise SystemExit(f"CLIENT_HOST_PORT did not apply to client: {moved_bindings('client')}")
          if (19090, 9090) not in moved_bindings("prometheus"):
              raise SystemExit(f"PROMETHEUS_HOST_PORT did not apply: {moved_bindings('prometheus')}")
          if (13000, 3000) not in moved_bindings("grafana"):
              raise SystemExit(f"GRAFANA_HOST_PORT did not apply: {moved_bindings('grafana')}")
          print("compose service DNS ok")
          PY
