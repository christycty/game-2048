# Scrapes the API service on the Compose network. Both `dev` and `prod`
# publish the alias `api`, so one scrape target covers either profile.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: game-2048-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
